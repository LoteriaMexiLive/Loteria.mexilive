<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTERÍA MEXILIVE</title>
<style>
:root{
  --bg:#03184f;
  --bg2:#061f62;
  --panel:#082b70;
  --panel2:#0b347f;
  --panel3:#06235f;
  --ink:#f7fbff;
  --muted:#a9c4ee;
  --accent:#f20b91;
  --accent2:#ff2ba8;
  --cyan:#18c8ff;
  --gold:#ffd447;
  --ok:#25df91;
  --line:#1456a5;
  --shadow:0 8px 25px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(135deg,var(--bg),#041e61 55%,#071451);
  color:var(--ink);
}
button,input,select{font:inherit}
button{
  cursor:pointer;border:1px solid #1762b7;border-radius:10px;
  padding:10px 13px;font-weight:800;color:#fff;
  background:#092d70;
}
.top{
  background:linear-gradient(90deg,#031447,#061f5e 55%,#06194e);
  color:#fff;padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid #114a91;
  box-shadow:0 4px 20px rgba(0,0,0,.25)
}
.top b{font-size:21px}
.top span{color:#ff3aa9}
.top small{color:#a9c4ee}
.wrap{max-width:1500px;margin:auto;padding:15px}
.layout{display:grid;grid-template-columns:350px 1fr;gap:15px}
.panel{
  background:linear-gradient(145deg,var(--panel),var(--panel3));
  border:1px solid var(--line);border-radius:16px;padding:15px;
  box-shadow:var(--shadow)
}
h1,h2,h3{color:#fff}
input{
  width:100%;padding:11px;border:1px solid #2167b6;
  border-radius:9px;margin-bottom:8px;
  background:#061f58;color:#fff;outline:none
}
input::placeholder{color:#8eacd8}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #18c8ff33}
select{
  background:#061f58;color:#fff;border:1px solid #2167b6;
  border-radius:8px;padding:7px
}
.primary{
  background:linear-gradient(90deg,#ec078d,#ff199f);
  border-color:#ff45b8;color:#fff;
  box-shadow:0 4px 15px #f20b9140
}
.gold{background:linear-gradient(90deg,#ffd447,#ffb92f);color:#241700;border-color:#ffe17b}
.dark{background:#071332;color:#fff;border-color:#2c5b9c}
.soft{background:#0c397f;color:#fff;border-color:#286ab4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.stat{
  background:linear-gradient(145deg,#0b397f,#07265e);
  border:1px solid #1457a1;border-radius:10px;padding:8px;text-align:center
}
.stat b{display:block;font-size:19px;color:#fff}
.hero{
  background:radial-gradient(circle at 50% 25%,#104b9b 0,#092e73 38%,#031a4e 100%);
  color:#fff;border-radius:16px;min-height:330px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid #1760b3;box-shadow:inset 0 0 35px #0005
}
.hero img{width:190px;height:245px;object-fit:contain;filter:drop-shadow(0 8px 14px #0008)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.player{
  background:linear-gradient(145deg,#0a347b,#06245d);
  border:1px solid #1760ad;border-radius:14px;padding:11px;
  box-shadow:0 5px 16px #0003
}
.player.done{
  outline:3px solid var(--accent);
  box-shadow:0 0 22px #f20b9155
}
.player strong{float:right;color:#18c8ff}
.bar{height:7px;background:#06183e;border-radius:9px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#19d8ff,#22e88f)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.board div{position:relative;border:1px solid #2a6ab0;border-radius:7px;overflow:hidden;background:#071b4a}
.board img{display:block;width:100%}
.board .mark:after{
  content:'✓';position:absolute;inset:0;display:grid;place-items:center;
  background:#16a978cc;color:#fff;font-size:25px;font-weight:900
}
#hist span{
  display:inline-block;background:#0c3b82;color:#d9eaff;
  border:1px solid #1d63a8;border-radius:20px;padding:5px 7px;margin:3px;font-size:12px
}
hr{border:0;border-top:1px solid #14509a;margin:16px 0}
#screen{
  display:none;position:fixed;inset:0;
  background:radial-gradient(circle at 50% 25%,#0b3d88,#031238 72%);
  color:#fff;z-index:20;padding:20px
}
#live{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#live img{max-height:70vh;max-width:80%;object-fit:contain;filter:drop-shadow(0 10px 25px #0009)}
#live h1{font-size:clamp(30px,5vw,65px);margin:5px;color:#fff;text-shadow:0 4px 15px #0008}
#winmodal{
  display:none;position:fixed;inset:0;background:#000b;z-index:30;place-items:center
}
.winbox{
  background:linear-gradient(145deg,#0b347d,#041b4f);
  color:#fff;border:1px solid #2367b3;border-radius:22px;padding:30px;
  text-align:center;max-width:600px;width:90%;box-shadow:0 20px 80px #000b
}
.winbox h1{font-size:55px;color:#ff2ba8;margin:0;text-shadow:0 0 20px #f20b9166}
small{color:#a9c4ee}
a{color:#5edcff}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.hero{min-height:250px}
  .top{flex-wrap:wrap}
}
</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b2d66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head><body>
<header class="top"><div><b>🇲🇽 LOTERÍA <span>MEXILIVE</span></b><small> — Panel de anfitriona</small></div><div><button class="gold" onclick="display()">📺 Pantalla LIVE</button><button class="soft" onclick="newRound()">🔄 Nueva ronda</button></div></header>
<div class="wrap"><div class="layout"><aside class="panel"><h2>🎙️ Control</h2><input id="name" placeholder="Nombre o @usuario"><button class="primary" style="width:100%" onclick="add()">➕ Registrar</button><p><button class="dark" id="reg" onclick="reg()">🔒 Cerrar registro</button></p><div class="stats"><div class="stat"><b id="pc">0</b>Jugadores</div><div class="stat"><b id="cc">0</b>Cartas</div><div class="stat"><b id="rem">54</b>Restantes</div></div><h3>🃏 Llamar carta</h3><button class="primary" onclick="draw()">🎴 Sacar</button> <button class="soft" onclick="undo()">↩️ Deshacer</button> <button class="soft" onclick="repeat()">🔊 Repetir</button><p><button class="soft" onclick="auto()">▶️ Auto</button> <button class="soft" onclick="stop()">⏸️ Pausar</button><select id="speed"><option>15</option><option>10</option><option>5</option><option>30</option></select> segundos</p><h3>Historial</h3><div id="hist">Sin cartas</div><hr><h3>🏆 Ganadores</h3><div id="wins">Ninguno todavía</div><hr><button class="soft" onclick="exportData()">⬇️ Exportar</button> <button class="soft" onclick="clearData()">🧹 Limpiar</button></aside>
<main><div class="panel"><div class="hero" id="hero"></div></div><div class="panel" style="margin-top:15px"><h2>👥 Tableros</h2><input id="search" placeholder="🔎 Buscar por nombre/@usuario" oninput="render()"><small id="show"></small><div id="players" class="players" style="margin-top:10px"></div></div></main></div></div>
<div id="screen"><div id="live"></div><button class="gold" onclick="closeDisplay()" style="position:fixed;right:20px;top:20px">Cerrar</button></div>
<div id="winmodal"><div class="winbox"><div style="font-size:85px">🏆</div><h1>¡LOTERÍA!</h1><h2 id="winname"></h2><p>El tablero llegó a 16/16. Verifica en pantalla y confirma al ganador.</p><button class="primary" onclick="confirmWin()">✅ Confirmar ganador</button><button class="soft" onclick="document.getElementById('winmodal').style.display='none'">Revisar</button></div></div>
<script>
const N=54;
const names=["El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "La Sirena", "La Escalera", "La Botella", "El Barril", "El Árbol", "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello", "La Garza", "El Pájaro", "La Mano", "La Bota", "La Luna", "El Cotorro", "El Borracho", "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Camarón", "Las Jaras", "El Músico", "La Araña", "El Soldado", "La Estrella", "El Cazo", "El Mundo", "El Apache", "El Nopal", "El Alacrán", "La Rosa", "La Calavera", "La Campana", "El Cantarito", "El Venado", "El Sol", "La Corona", "La Chalupa", "El Pino", "El Pescado", "La Palma", "La Maceta", "El Arpa", "La Rana"];
let S={players:JSON.parse(localStorage.getItem('l5p')||'[]'),called:JSON.parse(localStorage.getItem('l5c')||'[]'),winners:JSON.parse(localStorage.getItem('l5w')||'[]'),open:localStorage.getItem('l5r')!=='closed'};
let timer=null,pending=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('l5p',JSON.stringify(S.players));localStorage.setItem('l5c',JSON.stringify(S.called));localStorage.setItem('l5w',JSON.stringify(S.winners));localStorage.setItem('l5r',S.open?'open':'closed')}
function board(){let a=[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5);return a.slice(0,16)}
function add(){if(!S.open)return alert('El registro está cerrado.');let v=$('name').value.trim();if(!v)return;S.players.push({id:Date.now()+Math.random(),num:S.players.length+1,name:v,board:board()});$('name').value='';save();render()}
function reg(){S.open=!S.open;save();render()}
function draw(){if(S.called.length===N){stop();return}let a=[...Array(N)].map((_,i)=>i+1).filter(x=>!S.called.includes(x));let n=a[Math.floor(Math.random()*a.length)];S.called.push(n);save();render();let p=S.players.find(p=>p.board.every(x=>S.called.includes(x))&&!S.winners.some(w=>w.id===p.id));if(p){pending=p;$('winname').textContent=p.name;$('winmodal').style.display='grid';speak('¡Lotería! '+p.name)}}
function undo(){S.called.pop();save();render()}
function speak(t){if(speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function repeat(){if(S.called.length)speak(names[S.called.at(-1)-1])}
function auto(){stop();draw();timer=setInterval(draw,+$('speed').value*1000)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function confirmWin(){if(pending&&!S.winners.some(w=>w.id===pending.id)){S.winners.push({id:pending.id,num:pending.num,name:pending.name,time:new Date().toLocaleString('es-MX')});save()}pending=null;$('winmodal').style.display='none';render()}
function newRound(){if(!confirm('¿Nueva ronda con los mismos participantes?'))return;S.players=S.players.map((p,i)=>({...p,num:i+1,board:board()}));S.called=[];S.winners=[];S.open=false;save();render()}
function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(n){return 'cards/'+String(n).padStart(2,'0')+'.svg'}
function render(){
 $('pc').textContent=S.players.length;$('cc').textContent=S.called.length;$('rem').textContent=N-S.called.length;$('reg').textContent=S.open?'🔒 Cerrar registro':'🔓 Abrir registro';
 $('hero').innerHTML=S.called.length?`<img src="${card(S.called.at(-1))}"><h1>${names[S.called.at(-1)-1]}</h1><small>Carta ${S.called.length} de ${N}</small>`:'<div style="font-size:70px">🎴</div><h1>Lista para comenzar</h1>';
 $('hist').innerHTML=S.called.slice().reverse().map(n=>`<span>${n}. ${names[n-1]}</span>`).join('')||'Sin cartas';
 let q=$('search').value.toLowerCase();let a=S.players.filter(p=>p.name.toLowerCase().includes(q));$('show').textContent=`${a.length} de ${S.players.length}`;
 $('players').innerHTML=a.map(p=>{let m=p.board.filter(n=>S.called.includes(n)).length;return `<article class="player ${m==16?'done':''}"><b>#${p.num} ${esc(p.name)}</b><strong>${m}/16</strong><div class="bar"><i style="width:${m*6.25}%"></i></div><div class="board">${p.board.map(n=>`<div class="${S.called.includes(n)?'mark':''}"><img src="${card(n)}"></div>`).join('')}</div><button onclick="removeP('${p.id}')">Eliminar</button></article>`}).join('');
 $('wins').innerHTML=S.winners.map(w=>`🏆 #${w.num} ${esc(w.name)} — ${w.time}`).join('<br>')||'Ninguno todavía';
 $('live').innerHTML=S.called.length?`<img src="${card(S.called.at(-1))}"><h1>${names[S.called.at(-1)-1]}</h1>` :'<div style="font-size:100px">🎴</div><h1>LOTERÍA MEXILIVE</h1>';
}
function removeP(id){S.players=S.players.filter(p=>String(p.id)!==String(id));S.players.forEach((p,i)=>p.num=i+1);save();render()}
function display(){ $('screen').style.display='block';render()}
function closeDisplay(){ $('screen').style.display='none'}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resultados-loteria-v5.json';a.click()}
function clearData(){if(confirm('¿Borrar cartas y ganadores?')){S.called=[];S.winners=[];save();render()}}
window.add=add;window.reg=reg;window.draw=draw;window.undo=undo;window.repeat=repeat;window.auto=auto;window.stop=stop;window.confirmWin=confirmWin;window.newRound=newRound;window.removeP=removeP;window.display=display;window.closeDisplay=closeDisplay;window.exportData=exportData;window.clearData=clearData;
render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
</body></html>
